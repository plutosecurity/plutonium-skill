AWSTemplateFormatVersion: "2010-09-09"
Description: One-time admin-owned execution role for the Plutonium catalog lookup Lambda.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

Resources:
  LookupExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub plutonium-catalog-lookup-execution-${Environment}
      Description: Least-privilege runtime role for the Plutonium catalog lookup Lambda.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadPrivatePlutoniumCatalog
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCatalogObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::plutonium-catalog-lookup-${AWS::AccountId}-${AWS::Region}-${Environment}/*
              - Sid: ReadCatalogBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::plutonium-catalog-lookup-${AWS::AccountId}-${AWS::Region}-${Environment}
      Tags:
        - Key: Service
          Value: plutonium-catalog-lookup
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ExecutionRoleArn:
    Value: !GetAtt LookupExecutionRole.Arn
  ExecutionRoleName:
    Value: !Ref LookupExecutionRole
